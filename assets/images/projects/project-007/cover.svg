<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="'Segoe UI', Arial, sans-serif">
  <rect width="1200" height="800" fill="#0A1215"/>
  <rect x="0" y="0" width="1200" height="64" fill="#0C1A1E"/>
  <text x="40" y="40" fill="#8CE9EE" font-size="20" font-weight="700" letter-spacing="2">ROCK SUPPORT DEVICE</text>
  <text x="1160" y="40" fill="#7E9094" font-size="13" text-anchor="end">Hydraulic tunnel support · up to 3 m</text>
  <!-- rock strata -->
  <g fill="#0C1A1D">
    <rect x="140" y="90" width="920" height="40"/>
  </g>
  <g fill="#0E1E22">
    <rect x="140" y="130" width="920" height="40"/>
  </g>
  <!-- tunnel arch -->
  <path d="M220 560 L220 320 A 380 280 0 0 1 980 320 L980 560" fill="#05090A" stroke="#14DDE5" stroke-width="3"/>
  <!-- floor -->
  <line x1="220" y1="560" x2="980" y2="560" stroke="#14DDE5" stroke-width="3"/>
  <!-- support device -->
  <rect x="560" y="560" width="80" height="16" rx="4" fill="#2A3A3E"/>
  <rect x="585" y="360" width="30" height="200" rx="6" fill="#0E7F8A" stroke="#14DDE5" stroke-width="2"/>
  <rect x="590" y="300" width="20" height="70" rx="4" fill="#8CE9EE"/>
  <rect x="560" y="284" width="80" height="16" rx="4" fill="#2A3A3E"/>
  <!-- hydraulic lines -->
  <path d="M600 480 C 640 480 660 520 700 520" fill="none" stroke="#FFD166" stroke-width="3"/>
  <rect x="690" y="500" width="70" height="40" rx="8" fill="#0A1416" stroke="#FFD166" stroke-width="2"/>
  <text x="725" y="524" fill="#FFD166" font-size="12" text-anchor="middle">PUMP</text>
  <!-- force arrows -->
  <g stroke="#2ECC71" stroke-width="4" fill="#2ECC71">
    <line x1="600" y1="260" x2="600" y2="200"/>
    <path d="M600 200 l-10 -6 v12 z"/>
    <line x1="560" y1="320" x2="470" y2="320"/>
    <path d="M470 320 l-6 -10 h12 z"/>
    <line x1="640" y1="320" x2="730" y2="320"/>
    <path d="M730 320 l6 -10 h-12 z"/>
  </g>
  <!-- labels -->
  <g fill="#7E9094" font-size="12">
    <text x="600" y="186" text-anchor="middle" fill="#2ECC71">Roof support force</text>
    <text x="470" y="306" text-anchor="end">Wall force</text>
    <text x="730" y="306">Wall force</text>
    <text x="600" y="610" text-anchor="middle">Extends to 3 m vertically</text>
  </g>
  <rect x="120" y="704" width="960" height="56" rx="8" fill="#0C1A1E"/>
  <text x="140" y="738" fill="#AEBFC1" font-size="15" font-weight="600">Standing between miners and rockfalls.</text>
</svg>
