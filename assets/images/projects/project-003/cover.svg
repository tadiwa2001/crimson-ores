    <circle cx="340" cy="390" r="5"/><circle cx="380" cy="390" r="5"/><circle cx="420" cy="390" r="5"/><circle cx="460" cy="390" r="5"/><circle cx="500" cy="390" r="5"/><circle cx="540" cy="390" r="5"/><circle cx="580" cy="390" r="5"/><circle cx="620" cy="390" r="5"/><circle cx="660" cy="390" r="5"/>
