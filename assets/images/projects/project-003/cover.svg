  <text x="600" y="35" fill="#8CE9EE" font-size="16" font-weight="600" text-anchor="middle">DRILL &amp; BLAST DESIGN</text>
  <rect x="1050" y="14" width="120" height="28" rx="6" fill="#FFD166" opacity="0.12"/>
  <text x="1110" y="33" fill="#FFD166" font-size="13" font-weight="600">SIMULATION</text>
  <rect x="224" y="76" width="222" height="84" rx="10" fill="#0D171A" stroke="#14DDE5" stroke-opacity="0.18"/>
  <text x="242" y="102" fill="#7E9094" font-size="12">HOLE DIAMETER</text>
  <text x="242" y="134" fill="#FFFFFF" font-size="26" font-weight="700">115 mm</text>
  <rect x="462" y="76" width="222" height="84" rx="10" fill="#0D171A" stroke="#14DDE5" stroke-opacity="0.18"/>
  <text x="480" y="102" fill="#7E9094" font-size="12">BENCH HEIGHT</text>
