    <circle cx="570" cy="700" r="12" fill="#14DDE5" opacity="0.9"/><text x="570" y="704" fill="#041B1F" font-weight="700">100</text>
    <circle cx="630" cy="700" r="12" fill="#14DDE5" opacity="0.9"/><text x="630" y="704" fill="#041B1F" font-weight="700">125</text>
    <circle cx="690" cy="700" r="12" fill="#14DDE5" opacity="0.9"/><text x="690" y="704" fill="#041B1F" font-weight="700">150</text>
    <circle cx="750" cy="700" r="12" fill="#14DDE5" opacity="0.9"/><text x="750" y="704" fill="#041B1F" font-weight="700">175</text>
    <text x="820" y="704" fill="#7E9094">…</text>
