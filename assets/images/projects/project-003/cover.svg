    <circle cx="340" cy="510" r="5"/><circle cx="380" cy="510" r="5"/><circle cx="420" cy="510" r="5"/><circle cx="460" cy="510" r="5"/><circle cx="500" cy="510" r="5"/><circle cx="540" cy="510" r="5"/><circle cx="580" cy="510" r="5"/><circle cx="620" cy="510" r="5"/><circle cx="660" cy="510" r="5"/>
    <circle cx="340" cy="570" r="5"/><circle cx="380" cy="570" r="5"/><circle cx="420" cy="570" r="5"/><circle cx="460" cy="570" r="5"/><circle cx="500" cy="570" r="5"/><circle cx="540" cy="570" r="5"/><circle cx="580" cy="570" r="5"/><circle cx="620" cy="570" r="5"/><circle cx="660" cy="570" r="5"/>
  </g>
  <g stroke="#FFD166" stroke-width="1.5">
    <line x1="340" y1="245" x2="340" y2="600" stroke-dasharray="4 4" opacity="0.6"/>
    <line x1="300" y1="270" x2="720" y2="270" stroke-dasharray="4 4" opacity="0.6"/>
  </g>
  <text x="680" y="270" fill="#FFD166" font-size="11">Spacing 4.0 m</text>
  <text x="340" y="238" fill="#FFD166" font-size="11">Burden 3.5 m</text>
  <rect x="822" y="180" width="354" height="480" rx="12" fill="#0D171A" stroke="#14DDE5" stroke-opacity="0.16"/>
  <text x="842" y="208" fill="#AEBFC1" font-size="13" font-weight="600">CHARGE &amp; INITIATION</text>
  <g font-size="12.5" fill="#7E9094">
    <text x="842" y="242">Hole depth</text><text x="1156" y="242" fill="#FFFFFF" text-anchor="end">11.5 m</text>
    <text x="842" y="270">Sub-drill</text><text x="1156" y="270" fill="#FFFFFF" text-anchor="end">1.0 m</text>
    <text x="842" y="298">Stemming</text><text x="1156" y="298" fill="#FFFFFF" text-anchor="end">3.0 m</text>
    <text x="842" y="326">Charge / hole</text><text x="1156" y="326" fill="#FFFFFF" text-anchor="end">72 kg</text>
    <text x="842" y="354">Explosive</text><text x="1156" y="354" fill="#FFFFFF" text-anchor="end">ANFO</text>
    <text x="842" y="382">Initiation</text><text x="1156" y="382" fill="#FFFFFF" text-anchor="end">Electronic</text>
    <text x="842" y="410">Delay pattern</text><text x="1156" y="410" fill="#FFFFFF" text-anchor="end">25 ms</text>
    <text x="842" y="438">Rows × holes</text><text x="1156" y="438" fill="#FFFFFF" text-anchor="end">6 × 9</text>
    <text x="842" y="466">Total charge</text><text x="1156" y="466" fill="#FFFFFF" text-anchor="end">3,888 kg</text>
  </g>
  <rect x="842" y="490" width="314" height="1" fill="#14DDE5" opacity="0.15"/>
  <text x="842" y="520" fill="#8CE9EE" font-size="12" font-weight="600">PREDICTED RESULT</text>
  <g font-size="12.5" fill="#7E9094">
    <text x="842" y="548">Rock volume</text><text x="1156" y="548" fill="#FFFFFF" text-anchor="end">21,600 m³</text>
    <text x="842" y="576">Tonnage</text><text x="1156" y="576" fill="#FFFFFF" text-anchor="end">58,300 t</text>
    <text x="842" y="604">P80 fragmentation</text><text x="1156" y="604" fill="#FFFFFF" text-anchor="end">120 mm</text>
    <text x="842" y="632">Vibration (PPV)</text><text x="1156" y="632" fill="#FFFFFF" text-anchor="end">8.4 mm/s</text>
  </g>
  <rect x="224" y="672" width="952" height="64" rx="12" fill="#0D171A" stroke="#14DDE5" stroke-opacity="0.16"/>
  <text x="244" y="700" fill="#AEBFC1" font-size="13" font-weight="600">INITIATION SEQUENCE</text>
  <g font-size="10" fill="#7E9094" text-anchor="middle">
