<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="'Segoe UI', Arial, sans-serif">
  <rect width="1200" height="800" fill="#0A1215"/>
  <rect x="0" y="0" width="1200" height="64" fill="#0C1A1E"/>
  <text x="40" y="40" fill="#8CE9EE" font-size="20" font-weight="700" letter-spacing="2">SOLAR POWERED WATER RECYCLING</text>
  <text x="1160" y="40" fill="#7E9094" font-size="13" text-anchor="end">Capture · Filter · Reuse</text>
  <!-- solar panel -->
  <rect x="120" y="140" width="170" height="96" rx="8" fill="#0A3A3E" transform="rotate(-14 205 188)"/>
  <g stroke="#14DDE5" stroke-width="2" opacity="0.8" transform="rotate(-14 205 188)">
    <line x1="132" y1="168" x2="278" y2="168"/><line x1="132" y1="196" x2="278" y2="196"/>
    <line x1="150" y1="140" x2="150" y2="236"/><line x1="205" y1="140" x2="205" y2="236"/><line x1="260" y1="140" x2="260" y2="236"/>
  </g>
  <line x1="205" y1="236" x2="330" y2="470" stroke="#14DDE5" stroke-width="2" stroke-dasharray="5 4"/>
  <!-- water source -->
  <path d="M360 620 q30 -20 60 0 q30 20 60 0 q30 -20 60 0 q30 20 60 0" fill="none" stroke="#14DDE5" stroke-width="4" stroke-linecap="round"/>
  <text x="520" y="664" fill="#7E9094" font-size="12" text-anchor="middle">Shaft water (water table)</text>
  <!-- pump -->
  <rect x="420" y="470" width="150" height="80" rx="10" fill="#0E7F8A" stroke="#14DDE5" stroke-width="2"/>
  <circle cx="470" cy="510" r="20" fill="none" stroke="#14DDE5" stroke-width="4"/>
  <path d="M470 496 v28 M460 504 h20" stroke="#14DDE5" stroke-width="4" stroke-linecap="round"/>
  <text x="495" y="545" fill="#FFFFFF" font-size="14" font-weight="700" text-anchor="middle">PUMP</text>
  <!-- filter stages -->
  <g>
    <rect x="620" y="470" width="70" height="100" rx="10" fill="#0A1C20" stroke="#14DDE5" stroke-width="2"/><text x="655" y="520" fill="#8CE9EE" font-size="12" text-anchor="middle">FILTER</text>
    <rect x="712" y="470" width="70" height="100" rx="10" fill="#0A1C20" stroke="#14DDE5" stroke-width="2"/><text x="747" y="520" fill="#8CE9EE" font-size="12" text-anchor="middle">FILTER</text>
    <rect x="804" y="470" width="70" height="100" rx="10" fill="#0A1C20" stroke="#14DDE5" stroke-width="2"/><text x="839" y="520" fill="#8CE9EE" font-size="12" text-anchor="middle">FILTER</text>
  </g>
  <!-- pipes -->
  <g stroke="#14DDE5" stroke-width="5" fill="none" stroke-linecap="round">
    <line x1="570" y1="510" x2="620" y2="510"/>
    <line x1="690" y1="510" x2="712" y2="510"/>
    <line x1="782" y1="510" x2="804" y2="510"/>
    <line x1="874" y1="510" x2="940" y2="510"/>
    <line x1="940" y1="510" x2="940" y2="300"/>
  </g>
  <path d="M820 510 l18 -8 l-18 0 z M840 500 l-18 -8 l18 0 z" fill="#14DDE5" opacity="0"/>
  <!-- flow arrows -->
  <g fill="#14DDE5">
    <path d="M600 510 l-14 0 8 -8 z"/>
    <path d="M700 510 l-14 0 8 -8 z"/>
    <path d="M792 510 l-14 0 8 -8 z"/>
    <path d="M940 340 l0 -16 -8 8 z"/>
  </g>
  <!-- storage tank -->
  <rect x="880" y="220" width="130" height="130" rx="12" fill="#0A3A3E" stroke="#14DDE5" stroke-width="2"/>
  <path d="M880 260 q65 18 130 0" fill="none" stroke="#14DDE5" stroke-width="3"/>
  <text x="945" y="300" fill="#FFFFFF" font-size="14" font-weight="700" text-anchor="middle">TANK</text>
  <!-- output uses -->
  <g stroke="#8CE9EE" stroke-width="4" stroke-linecap="round">
    <line x1="945" y1="350" x2="945" y2="600"/>
  </g>
  <g font-size="13" fill="#AEBFC1">
    <rect x="840" y="600" width="210" height="40" rx="8" fill="#0C1A1E"/>
    <text x="945" y="626" text-anchor="middle">Drilling · dust suppression</text>
    <rect x="840" y="652" width="210" height="40" rx="8" fill="#0C1A1E"/>
    <text x="945" y="678" text-anchor="middle">Water blasting · blowpipe</text>
  </g>
  <rect x="120" y="704" width="960" height="56" rx="8" fill="#0C1A1E"/>
  <text x="140" y="738" fill="#AEBFC1" font-size="15" font-weight="600">Turning waste water into a working resource.</text>
</svg>
