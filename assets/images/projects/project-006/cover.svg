<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="'Segoe UI', Arial, sans-serif">
  <rect width="1200" height="800" fill="#0A1215"/>
  <rect x="0" y="0" width="1200" height="64" fill="#0C1A1E"/>
  <text x="40" y="40" fill="#8CE9EE" font-size="20" font-weight="700" letter-spacing="2">CONSTRUCTION MATERIAL FROM WASTE</text>
  <text x="1160" y="40" fill="#7E9094" font-size="13" text-anchor="end">Waste rock crusher</text>
  <!-- waste rock input -->
  <g fill="#0A4A4F" stroke="#14DDE5" stroke-width="2">
    <polygon points="200,180 260,160 300,200 250,230"/>
    <polygon points="300,150 350,140 380,180 320,195"/>
    <polygon points="240,120 300,110 330,150 270,160"/>
  </g>
  <path d="M300 200 L520 300" stroke="#7E9094" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="180" y="250" fill="#7E9094" font-size="12">Waste rock in</text>
  <!-- hopper -->
  <path d="M430 250 L770 250 L680 380 L520 380 Z" fill="#0E7F8A" stroke="#14DDE5" stroke-width="3"/>
  <!-- crushing chamber -->
  <rect x="480" y="380" width="240" height="180" fill="#0A1416" stroke="#14DDE5" stroke-width="3"/>
  <path d="M480 380 L560 560 L480 560 Z" fill="#2A3A3E"/>
  <path d="M720 380 L640 560 L720 560 Z" fill="#2A3A3E"/>
  <g stroke="#14DDE5" stroke-width="2" opacity="0.7">
    <line x1="490" y1="400" x2="560" y2="560"/><line x1="510" y1="400" x2="570" y2="560"/>
    <line x1="710" y1="400" x2="640" y2="560"/><line x1="690" y1="400" x2="630" y2="560"/>
  </g>
  <!-- motor + flywheel -->
  <circle cx="760" cy="430" r="40" fill="none" stroke="#14DDE5" stroke-width="5"/>
  <circle cx="760" cy="430" r="8" fill="#14DDE5"/>
  <text x="820" y="440" fill="#7E9094" font-size="12">Motor</text>
  <!-- crushed aggregate -->
  <g fill="#0E7F8A" stroke="#14DDE5" stroke-width="1.5">
    <circle cx="520" cy="600" r="8"/><circle cx="548" cy="600" r="6"/><circle cx="574" cy="600" r="9"/>
    <circle cx="606" cy="600" r="7"/><circle cx="636" cy="600" r="8"/><circle cx="668" cy="600" r="6"/>
  </g>
  <!-- conveyor -->
  <rect x="500" y="612" width="300" height="16" rx="8" fill="#2A3A3E"/>
  <circle cx="512" cy="620" r="14" fill="#0C1A1E" stroke="#14DDE5" stroke-width="2"/>
  <circle cx="788" cy="620" r="14" fill="#0C1A1E" stroke="#14DDE5" stroke-width="2"/>
  <line x1="512" y1="620" x2="788" y2="620" stroke="#14DDE5" stroke-width="2"/>
  <text x="840" y="624" fill="#7E9094" font-size="12">Sized aggregate out</text>
  <!-- result label -->
  <rect x="880" y="520" width="240" height="90" rx="10" fill="#0C1A1E"/>
  <text x="1000" y="548" fill="#8CE9EE" font-size="13" font-weight="600" text-anchor="middle">READY FOR</text>
  <text x="1000" y="576" fill="#AEBFC1" font-size="13" text-anchor="middle">concrete · foundations</text>
  <text x="1000" y="596" fill="#AEBFC1" font-size="13" text-anchor="middle">· infrastructure</text>
  <rect x="120" y="704" width="960" height="56" rx="8" fill="#0C1A1E"/>
  <text x="140" y="738" fill="#AEBFC1" font-size="15" font-weight="600">Turning mine waste into building blocks.</text>
</svg>
