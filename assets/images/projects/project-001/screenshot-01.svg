<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="'Segoe UI', Arial, sans-serif">
  <rect width="1200" height="800" fill="#0A1215"/>
  <rect width="1200" height="56" fill="#0C1A1E"/>
  <circle cx="22" cy="28" r="6" fill="#14DDE5" opacity="0.85"/>
  <circle cx="44" cy="28" r="6" fill="#AEBFC1" opacity="0.35"/>
  <circle cx="66" cy="28" r="6" fill="#AEBFC1" opacity="0.35"/>
  <text x="120" y="34" fill="#AEBFC1" font-size="15" font-weight="600">CRIMSON ORES</text>
  <text x="600" y="35" fill="#8CE9EE" font-size="16" font-weight="600" text-anchor="middle">PRODUCTION SCHEDULING</text>
  <rect x="224" y="78" width="222" height="84" rx="10" fill="#0D171A" stroke="#14DDE5" stroke-opacity="0.18"/>
  <text x="242" y="104" fill="#7E9094" font-size="12">ANNUAL TONNAGE</text>
  <text x="242" y="134" fill="#FFFFFF" font-size="26" font-weight="700">1.6 Mt/yr</text>
  <rect x="462" y="78" width="222" height="84" rx="10" fill="#0D171A" stroke="#14DDE5" stroke-opacity="0.18"/>
  <text x="480" y="104" fill="#7E9094" font-size="12">HEAD GRADE</text>
  <text x="480" y="134" fill="#FFFFFF" font-size="26" font-weight="700">1.72% Cu</text>
  <rect x="700" y="78" width="222" height="84" rx="10" fill="#0D171A" stroke="#14DDE5" stroke-opacity="0.18"/>
  <text x="718" y="104" fill="#7E9094" font-size="12">FLEET</text>
  <text x="718" y="134" fill="#FFFFFF" font-size="26" font-weight="700">12 trucks</text>
  <rect x="938" y="78" width="238" height="84" rx="10" fill="#0D171A" stroke="#14DDE5" stroke-opacity="0.18"/>
  <text x="956" y="104" fill="#7E9094" font-size="12">LIFE OF MINE</text>
  <text x="956" y="134" fill="#FFFFFF" font-size="26" font-weight="700">14 years</text>
  <!-- bar chart panel -->
  <rect x="224" y="182" width="580" height="340" rx="12" fill="#0D171A" stroke="#14DDE5" stroke-opacity="0.16"/>
  <text x="244" y="210" fill="#AEBFC1" font-size="13" font-weight="600">ORE TONNES BY PERIOD</text>
  <g fill="#14DDE5" opacity="0.85">
    <rect x="256" y="450" width="30" height="50"/><rect x="300" y="430" width="30" height="70"/>
    <rect x="344" y="410" width="30" height="90"/><rect x="388" y="390" width="30" height="110"/>
    <rect x="432" y="380" width="30" height="120"/><rect x="476" y="360" width="30" height="140"/>
    <rect x="520" y="370" width="30" height="130"/><rect x="564" y="350" width="30" height="150"/>
    <rect x="608" y="360" width="30" height="140"/><rect x="652" y="340" width="30" height="160"/>
  </g>
  <g fill="#14DDE5" opacity="0.45">
    <rect x="696" y="360" width="30" height="140"/><rect x="740" y="340" width="30" height="160"/>
  </g>
  <line x1="244" y1="500" x2="784" y2="500" stroke="#AEBFC1" stroke-opacity="0.3"/>
  <g font-size="10.5" fill="#7E9094">
    <text x="271" y="516" text-anchor="middle">Y1</text><text x="403" y="516" text-anchor="middle">Y3</text>
    <text x="535" y="516" text-anchor="middle">Y5</text><text x="667" y="516" text-anchor="middle">Y7</text>
    <text x="755" y="516" text-anchor="middle">Y10</text>
  </g>
  <!-- line chart panel -->
  <rect x="822" y="182" width="354" height="340" rx="12" fill="#0D171A" stroke="#14DDE5" stroke-opacity="0.16"/>
  <text x="842" y="210" fill="#AEBFC1" font-size="13" font-weight="600">GRADE vs CUT-OFF</text>
  <polyline points="842,470 892,450 942,430 992,420 1042,410 1092,400 1142,395" fill="none" stroke="#14DDE5" stroke-width="2.5"/>
  <polyline points="842,490 892,470 942,455 992,440 1042,428 1092,418 1142,410" fill="none" stroke="#FFD166" stroke-width="2" stroke-dasharray="5 4"/>
  <g font-size="11" fill="#7E9094">
    <circle cx="842" cy="300" r="4" fill="#14DDE5"/><text x="854" y="304">Head grade</text>
    <circle cx="842" cy="326" r="4" fill="#FFD166"/><text x="854" y="330">Cut-off grade</text>
  </g>
  <!-- Gantt panel -->
  <rect x="224" y="540" width="952" height="220" rx="12" fill="#0D171A" stroke="#14DDE5" stroke-opacity="0.16"/>
  <text x="244" y="568" fill="#AEBFC1" font-size="13" font-weight="600">PHASE SCHEDULE</text>
  <g font-size="12" fill="#7E9094">
    <text x="244" y="598">Pre-strip</text><text x="244" y="632">Phase 1</text><text x="244" y="666">Phase 2</text><text x="244" y="700">Phase 3</text>
  </g>
  <g fill="#14DDE5">
    <rect x="360" y="586" width="240" height="20" rx="4" opacity="0.55"/>
    <rect x="360" y="620" width="330" height="20" rx="4" opacity="0.8"/>
    <rect x="360" y="654" width="270" height="20" rx="4" opacity="0.65"/>
    <rect x="360" y="688" width="200" height="20" rx="4" opacity="0.9"/>
  </g>
  <g font-size="11" fill="#7E9094">
    <text x="360" y="722">0</text><text x="560" y="722">5 yrs</text><text x="760" y="722">10 yrs</text><text x="960" y="722">15 yrs</text>
  </g>
  <line x1="360" y1="706" x2="960" y2="706" stroke="#AEBFC1" stroke-opacity="0.3"/>
</svg>
