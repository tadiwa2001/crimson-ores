    <line x1="640" y1="300" x2="640" y2="430"/>
    <line x1="830" y1="360" x2="830" y2="470"/>
  </g>
  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1">
    <path d="M450 158 l-8 0 M450 178 l-8 0 M450 198 l-8 0"/>
    <path d="M640 162 l-8 0 M640 182 l-8 0 M640 202 l-8 0"/>
    <path d="M830 155 l-8 0 M830 175 l-8 0 M830 195 l-8 0"/>
  </g>
  <g fill="#8CE9EE" font-size="12" font-weight="600">
    <text x="450" y="142" text-anchor="middle">DH-014</text>
    <text x="640" y="146" text-anchor="middle">DH-022</text>
    <text x="830" y="140" text-anchor="middle">DH-031</text>
  </g>
  <g fill="#7E9094" font-size="11">
