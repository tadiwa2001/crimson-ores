<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="'Segoe UI', Arial, sans-serif">
  <rect width="1200" height="800" fill="#0A1215"/>
  <rect width="1200" height="56" fill="#0C1A1E"/>
  <circle cx="22" cy="28" r="6" fill="#14DDE5" opacity="0.85"/>
  <circle cx="44" cy="28" r="6" fill="#AEBFC1" opacity="0.35"/>
  <circle cx="66" cy="28" r="6" fill="#AEBFC1" opacity="0.35"/>
  <text x="120" y="34" fill="#AEBFC1" font-size="15" font-weight="600">CRIMSON ORES</text>
  <text x="600" y="35" fill="#8CE9EE" font-size="16" font-weight="600" text-anchor="middle">GEOLOGICAL CROSS-SECTION — A–A′</text>
  <rect x="224" y="76" width="952" height="620" rx="12" fill="#0D171A" stroke="#14DDE5" stroke-opacity="0.16"/>
  <text x="244" y="104" fill="#AEBFC1" font-size="13" font-weight="600">SECTION A–A′ · ORE INTERCEPTS</text>
  <!-- strata -->
  <path d="M244 180 C420 150 700 170 1176 150 L1176 680 L244 680 Z" fill="#0A1416"/>
  <path d="M244 300 C400 280 720 300 1176 280 L1176 680 L244 680 Z" fill="#0C1A1D"/>
  <path d="M244 420 C420 400 760 420 1176 400 L1176 680 L244 680 Z" fill="#0E1E22"/>
  <path d="M244 540 C460 520 800 545 1176 520 L1176 680 L244 680 Z" fill="#102227"/>
