  <g stroke="#7E9094" stroke-opacity="0.4">
    <line x1="256" y1="200" x2="272" y2="200"/>
    <line x1="256" y1="300" x2="272" y2="300"/>
    <line x1="256" y1="400" x2="272" y2="400"/>
    <line x1="256" y1="500" x2="272" y2="500"/>
    <line x1="256" y1="600" x2="272" y2="600"/>
