  <path d="M244 180 C420 150 700 170 1176 150" fill="none" stroke="#14DDE5" stroke-opacity="0.5" stroke-width="2"/>
  <!-- drillholes -->
  <g stroke="#AEBFC1" stroke-width="2.5" fill="none">
