    <text x="640" y="448" text-anchor="middle" fill="#14DDE5">5.8 m @ 2.3% Cu</text>
    <text x="830" y="488" text-anchor="middle" fill="#14DDE5">4.1 m @ 1.6% Cu</text>
  </g>
